name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: rola
          POSTGRES_USER: rola
          POSTGRES_PASSWORD: rola
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rola" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_SETTINGS_MODULE: rola.test_settings
      ROLA_TEST_POSTGRESQL: "true"
      ROLA_POSTGRESQL_HOST: 127.0.0.1
      ROLA_POSTGRESQL_PORT: "5432"
      ROLA_POSTGRESQL_NAME: rola
      ROLA_POSTGRESQL_USER: rola
      ROLA_POSTGRESQL_PASSWORD: rola
      ROLCA_POSTGRESQL_HOST: 127.0.0.1
      ROLCA_POSTGRESQL_PORT: "5432"
      ROLCA_POSTGRESQL_NAME: rola
      ROLCA_POSTGRESQL_USER: rola
      ROLCA_POSTGRESQL_PASSWORD: rola
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -W error::DeprecationWarning
      - run: python -m pytest rolca tests --ds=tests.settings -W error::DeprecationWarning
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install './backend[test,lint,docs,package]'
      - run: python -m pip check
      - run: python -m ruff check backend docs/conf.py
      - run: python -m ruff format --check backend docs/conf.py
      - run: python -m mypy
        working-directory: backend
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m build backend
      - run: python -m twine check backend/dist/*
      - name: Check the installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        env:
          DJANGO_SETTINGS_MODULE: rola.test_settings
        run: |
          python -m pip install --no-deps --force-reinstall "$GITHUB_WORKSPACE"/backend/dist/*.whl
          python -I - <<'PY'
          import django
          from django.core.management import call_command
          from django.template.loader import get_template

          django.setup()
          call_command("check")
          for purpose in ("registration", "password_reset"):
              for template in ("email_subject.txt", "email_body.txt", "email_body.html"):
                  get_template(f"drf_user/{purpose}/{template}")
          PY

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: frontend/.node-version
      - run: python -m pip install './backend[test]'
      - run: python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: rola.test_settings
      - run: npm ci && npm run api:generate
        working-directory: frontend
      - run: git diff --exit-code -- backend/openapi.yaml frontend/src

  images:
    runs-on: ubuntu-24.04
    needs: [backend, quality, frontend, api-contract]
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: rola-${{ matrix.component }}:test
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
