name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: rola
          POSTGRES_USER: rola
          POSTGRES_PASSWORD: rola
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rola" --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:8.10.1-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_SETTINGS_MODULE: rola.test_settings
      ROLA_TEST_POSTGRESQL: "true"
      ROLA_POSTGRESQL_HOST: 127.0.0.1
      ROLA_POSTGRESQL_PORT: "5432"
      ROLA_POSTGRESQL_NAME: rola
      ROLA_POSTGRESQL_USER: rola
      ROLA_POSTGRESQL_PASSWORD: rola
      ROLCA_POSTGRESQL_HOST: 127.0.0.1
      ROLCA_POSTGRESQL_PORT: "5432"
      ROLCA_POSTGRESQL_NAME: rola
      ROLCA_POSTGRESQL_USER: rola
      ROLCA_POSTGRESQL_PASSWORD: rola
      ROLCA_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -W error::DeprecationWarning
      - run: python -m pytest rolca tests --ds=tests.settings -W error::DeprecationWarning
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install './backend[test,lint,docs,package]'
      - run: python -m pip check
      - run: python -m ruff check backend docs/conf.py
      - run: python -m ruff format --check backend docs/conf.py
      - run: python -m mypy
        working-directory: backend
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m build backend
      - run: python -m twine check backend/dist/*

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.node-version
      - run: python -m pip install './backend[test]'
      - run: python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: rola.test_settings
      - run: npm ci && npm run api:generate
        working-directory: frontend
      - run: git diff --exit-code -- backend/openapi.yaml frontend/src

  images:
    runs-on: ubuntu-24.04
    needs: [backend, quality, frontend, api-contract]
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: rola-${{ matrix.component }}:test
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
