services:
  postgresql:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: rolca
      POSTGRES_DB: rolca
      POSTGRES_PASSWORD: rolca
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolca"]
      interval: 2s
      timeout: 5s
      retries: 15
