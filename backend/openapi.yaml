          type: string
          nullable: true
          description: Return author's email for superusers, ``None`` field otherwise.
          readOnly: true
        dob:
          type: string
          format: date
          nullable: true
        school:
          type: string
          nullable: true
          maxLength: 100
        mentor:
          type: string
          nullable: true
          maxLength: 100
        club:
          type: string
          nullable: true
          maxLength: 100
        distinction:
          type: string
          nullable: true
          maxLength: 100
      required:
