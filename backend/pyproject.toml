[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "rola"
version = "0.1.0"
description = "Photography contest platform"
readme = "README.rst"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "drf_user/LICENSE"]
authors = [{name = "Domen Blenkuš", email = "domen@blenkus.com"}]
dependencies = [
    "Django>=6.1.1,<6.2",
    "django-cors-headers>=4.9,<5",
    "django-filter>=26.1,<27",
    "django-storages[s3]>=1.14.6,<2",
    "djangorestframework>=3.18.1,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=26.2,<27",
    "Pillow>=12.3,<13",
    "psycopg[binary]>=3.3.5,<4",
]

[project.urls]
Homepage = "https://github.com/dblenkus/rola"

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "pytest-django>=4.14,<5", "pytest-cov>=7.1,<8"]
docs = ["Sphinx>=9.1,<10", "sphinx-rtd-theme>=3.1,<4"]
package = ["build>=1.6.1,<2", "twine>=7,<8"]
lint = [
    "ruff>=0.16.8,<0.17",
    "mypy>=2.3.1,<3",
    "django-stubs>=6.1.1,<6.2",
    "djangorestframework-stubs>=3.18.1,<3.19",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rola*", "rolca*", "drf_user*", "utils*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"rolca.core" = ["locale/sl/LC_MESSAGES/django.*"]
"drf_user" = ["templates/**/*.txt", "templates/**/*.html"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rola.test_settings"
django_find_project = false
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["drf_user/tests", "rolca", "tests", "rola_integration/tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/migrations/**", "**/legacy_migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["rola/environment.py", "drf_user/settings.py", "drf_user/throttling.py"]
strict = true
warn_unused_ignores = true
